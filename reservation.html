  <section class="py-20 max-w-3xl mx-auto px-4">
    <div class="bg-slate-800/80 p-8 sm:p-12 rounded-3xl border border-slate-700 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <span class="text-indigo-400 font-bold text-xs uppercase tracking-widest">ÉCOLE PRIVÉE SAVA • Antalaha</span>
        <h1 class="text-3xl font-extrabold text-white">Formulaire d'Inscription En Ligne</h1>
        <p class="text-slate-400 text-sm">Fenoy ireto fampahafantarana ireto handefasana ny inscription amin'ny WhatsApp direct.</p>
      </div>

      <form id="quickRegistrationForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Anarana sy Fanampiny</label>
          <input type="text" id="regName" required placeholder="ohatra: Marie Rasoa" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Laharana Telefaonina (WhatsApp)</label>
            <input type="tel" id="regPhone" required placeholder="032 00 000 00" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Email</label>
            <input type="email" id="regEmail" required placeholder="rasoa@gmail.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Fidiana Formation</label>
          <select id="regCourse" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
            <option value="Développement Web Fullstack">Développement Web Fullstack (150,000 Ar/m)</option>
            <option value="Marketing Digital">Marketing Digital (120,000 Ar/m)</option>
            <option value="Anglais des Affaires">Anglais des Affaires (100,000 Ar/m)</option>
            <option value="Formation Sur-Mesure SAVA">Formation Sur-Mesure ÉCOLE PRIVÉE SAVA</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Fanamarihana</label>
          <textarea id="regNotes" rows="3" placeholder="Mampidira antsipirihany hafa..." class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm"></textarea>
        </div>
        <button type="submit" class="w-full py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-base shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-2xl"></i> Mandefa Inscription amin'ny WhatsApp
        </button>
      </form>
    </div>
